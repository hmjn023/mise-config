# Hyprland configuration migrated from modules/home-manager/hyprland.nix.
# The monitor rule is intentionally generic so it works on both hosts.

monitor = ,highres,auto,1

env = XCURSOR_SIZE,24
env = GTK_IM_MODULE,fcitx
env = QT_IM_MODULE,fcitx
env = XMODIFIERS,@im=fcitx

cursor {
    no_hardware_cursors = true
}

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = waybar
exec-once = mako
exec-once = fcitx5
exec-once = [workspace 1 silent] wezterm
exec-once = [workspace 2 silent] google-chrome-stable
exec-once = [workspace 9 silent] discord
exec-once = [workspace 10 silent] kitty btop

input {
    kb_layout = jp
    follow_mouse = 1
    sensitivity = -0.5

    touchpad {
        natural_scroll = no
    }
}

general {
    gaps_in = 2
    gaps_out = 10
    border_size = 5
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    layout = dwindle
    allow_tearing = false
}

decoration {
    rounding = 10

    blur {
        enabled = true
        size = 3
        passes = 1
    }
}

animations {
    enabled = yes
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

dwindle {
    preserve_split = yes
}

misc {
    force_default_wallpaper = 0
    middle_click_paste = false
}

$mainMod = SUPER
$mainModShift = SUPER SHIFT

# Applications
bind = $mainMod, T, exec, kitty
bind = $mainMod, Return, exec, wezterm
bind = $mainMod, E, exec, dolphin
bind = $mainMod, D, exec, wofi --show drun -I
bind = CTRL SHIFT, Escape, exec, kitty btop
bind = $mainModShift, T, exec, kitty iwctl
bind = $mainMod, W, exec, $HOME/eww.sh
bind = $mainModShift, W, exec, $HOME/side.sh

# System
bind = $mainModShift, Q, killactive,
bind = $mainModShift, E, exit,
bind = $mainModShift, Space, togglefloating,
bind = $mainMod, F, fullscreen
bind = $mainModShift, L, exec, swaylock -f --font "Noto Sans Mono CJK JP" -C ~/.config/swaylock/config
bind = $mainModShift, N, exec, swaync-client -t -sw
bind = $mainModShift, R, exec, hyprctl reload

# Screenshot and OCR
bind = CTRL, Print, exec, mkdir -p $HOME/Pictures/Screenshots && grim $HOME/Pictures/Screenshots/$(date +'%Y-%m-%d_%H%M%S_screenshot.png') && notify-send "Screenshot Saved"
bind = , Print, exec, mkdir -p $HOME/Pictures/Screenshots && grim $HOME/Pictures/Screenshots/$(date +'%Y-%m-%d_%H%M%S_screenshot.png') && notify-send "Screenshot Saved"
bind = $mainModShift, S, exec, grim -g "$(slurp)" - | wl-copy
bind = $mainMod, O, exec, grim -g "$(slurp)" - | tesseract -l eng stdin stdout | sed "s/ //g" | wl-copy
bind = $mainModShift, O, exec, grim -g "$(slurp)" - | tesseract -l jpn+eng stdin stdout | sed "s/ //g" | wl-copy

# Audio and brightness
bind = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
bind = , XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bind = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bind = , XF86AudioMicMute, exec, swayosd-client --input-volume mute-toggle
bind = , XF86MonBrightnessUp, exec, swayosd-client --brightness raise
bind = , XF86MonBrightnessDown, exec, swayosd-client --brightness lower

# Focus
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move to workspace
bind = $mainModShift, 1, movetoworkspace, 1
bind = $mainModShift, 2, movetoworkspace, 2
bind = $mainModShift, 3, movetoworkspace, 3
bind = $mainModShift, 4, movetoworkspace, 4
bind = $mainModShift, 5, movetoworkspace, 5
bind = $mainModShift, 6, movetoworkspace, 6
bind = $mainModShift, 7, movetoworkspace, 7
bind = $mainModShift, 8, movetoworkspace, 8
bind = $mainModShift, 9, movetoworkspace, 9
bind = $mainModShift, 0, movetoworkspace, 10

bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86AudioNext, exec, playerctl next

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

gesture = 3, horizontal, workspace
