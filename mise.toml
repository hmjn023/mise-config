[settings]
experimental = true
npm.package_manager = "aube"
dotfiles.root = "~/mise-config/dotfiles"
dotfiles.default_mode = "symlink"
system_packages.managers = ["pacman"]

[tools]
"aqua:jdx/mise" = "latest"
usage = "latest"
node = "latest"
uv = "latest"
aube = "latest"
bun = "latest"
biome = "latest"
claude = "latest"
terraform = "latest"
aws-cli = "latest"
"npm:@playwright/cli" = "latest"
"npm:ctx7" = "latest"
"npm:@openai/codex" = "latest"
"github:rtk-ai/rtk" = "latest"
"github:trkbt10/indexion" = "latest"
"github:k1LoW/mo" = "latest"
"github:ogulcancelik/herdr" = "latest"


[dotfiles]
"~/.config/mise/config.toml" = { source = "~/mise-config/mise.toml", mode = "symlink" }
"~/.config/mise/config.personal.toml" = { source = "~/mise-config/mise.personal.toml", mode = "symlink" }
"~/.config/mise/config.work.toml" = { source = "~/mise-config/mise.work.toml", mode = "symlink" }
"~/.zshrc" = {}
"~/.config/nvim" = {}
"~/.config/tmux/tmux.conf" = {}

[tasks.setup]
description = "Apply common packages, dotfiles, and user services"
run = """
set -eu
managed_mise="${MISE_DATA_DIR:-$HOME/.local/share/mise}/installs/aqua-jdx-mise/latest/mise/bin/mise"
if [ ! -x "$managed_mise" ]; then
  mise install aqua:jdx/mise@latest
fi
exec "$managed_mise" bootstrap --yes
"""

[tasks.check]
description = "Check package, dotfile, and systemd drift without applying changes"
run = [
  "mise bootstrap packages status --missing",
  "mise bootstrap dotfiles status --missing",
  "mise bootstrap linux systemd-units status --missing",
]
